# ============================================================================
#  StayEase - Nginx (production, HTTPS)
#
#    Cloudflare --HTTPS (Full strict)--> :443 nginx
#        /          -> React build (single page app, hash routes keep working)
#        /api/      -> Java backend (Tomcat) on the private Docker network
#
#  The TLS certificate is a Cloudflare Origin Certificate mounted from
#  ./nginx/certs/origin.pem + origin.key (never committed to Git).
# ============================================================================
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/cloudflare-realip.conf;

  # Basic abuse protection for the API (per visitor IP).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_status 429;

  # Docker service name, resolved on the private network (no container IPs hard-coded).
  upstream backend {
    server backend:8080;
    keepalive 16;
  }

  # ---- plain HTTP: health check + redirect to HTTPS ------------------------
  server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- HTTPS ----------------------------------------------------------------
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name hotel-reservation.opscloud.eu.cc;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;   # booking requests are tiny

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/security-headers.conf;

    # ---- REST API -> Java backend (never cached: it carries booking data) ----
    # /api (health ping) and everything below /api/ go to the backend
    location ~ ^/api(?:/|$) {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header Cache-Control;   # the backend sends it too; keep a single header
      proxy_hide_header X-Content-Type-Options;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
      add_header Cache-Control "no-store" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- fingerprinted build assets: cache for a year ------------------------
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- hotel photographs / logo (stable file names): cache for a week ------
    location ~* ^/(images/|logo\.svg$|robots\.txt$) {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=604800" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- the single page app: always revalidate index.html -------------------
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      include /etc/nginx/snippets/security-headers.conf;
    }
  }
}
