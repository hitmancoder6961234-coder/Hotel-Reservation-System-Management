# ============================================================================
#  StayEase - Nginx for LOCAL testing (plain HTTP, no certificate, no redirect).
#  Used by compose.local.yaml:  http://localhost:8080
# ============================================================================
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  upstream backend {
    server backend:8080;
    keepalive 16;
  }

  server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # /api (health ping) and everything below /api/ go to the backend
    location ~ ^/api(?:/|$) {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header Cache-Control;   # the backend sends it too; keep a single header
      proxy_hide_header X-Content-Type-Options;
      proxy_read_timeout 30s;
      add_header Cache-Control "no-store" always;
      include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache" always;
      include /etc/nginx/snippets/security-headers.conf;
    }
  }
}
