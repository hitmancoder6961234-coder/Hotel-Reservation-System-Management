# ============================================================================
#  StayEase CI/CD
#
#   test-frontend ─┐
#                  ├─> publish-images (push to main / tags) ─> deploy (optional, SSH)
#   test-backend  ─┘
#
#  test-backend runs the unit tests AND the MySQL integration tests (a real MySQL 8.4
#  service container with the project's schema).
#
#  Secrets / variables needed only for the optional deploy job (see docs/DEPLOYMENT.md):
#    secrets  SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY, (optional) DEPLOY_PATH, GHCR_USER, GHCR_TOKEN
#    variable DEPLOY_ENABLED = true
#  Building and pushing images uses the built-in GITHUB_TOKEN - nothing to create.
# ============================================================================
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  test-backend:
    name: Backend tests (unit + MySQL integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: stayease
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Create schema, seed rooms and the least-privilege application user
        run: |
          mysql -h 127.0.0.1 -uroot -pci-root-password stayease < database/init/01-schema.sql
          mysql -h 127.0.0.1 -uroot -pci-root-password stayease < database/init/02-seed.sql
          mysql -h 127.0.0.1 -uroot -pci-root-password -e "
            CREATE USER 'stayease_app'@'%' IDENTIFIED BY 'ci-app-password';
            GRANT SELECT, INSERT, UPDATE, DELETE ON stayease.* TO 'stayease_app'@'%';"
      - name: mvn verify
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/stayease?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true
          TEST_DB_USER: stayease_app
          TEST_DB_PASSWORD: ci-app-password
        run: mvn -B verify

  publish-images:
    name: Build and push images to GHCR
    needs: [test-frontend, test-backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image prefix (GHCR requires lowercase)
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.img.outputs.prefix }}-backend:latest
            ${{ steps.img.outputs.prefix }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push web (React + nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.prefix }}-web:latest
            ${{ steps.img.outputs.prefix }}-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy over SSH (optional)
    needs: publish-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH || '/opt/stayease' }}"
            git pull --ff-only
            bash scripts/backup.sh || true
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            fi
            docker compose pull
            docker compose up -d --no-build --remove-orphans
            docker image prune -f
            docker compose ps
